<h1 class="text-primary">Witaj Angular</h1>


<p class="text-info bg-success">Nasza zmienna wynosi: {{zmienna}}</p>
<p class="text-info bg-success">Wartość zmienej logicznej: {{zmienna3}}</p>

<button class="btn btn-success" (click)="moja_funkcja()">Przycisk</button>



<form (ngSubmit)="wysylanie()">
    <label for="imie">Imie:</label>
    <input type="text" id="imie" name="imie">
    <button>wyślij</button>
</form>

<p>{{tekst}}</p>


<p>{{imiona[0]}}</p>

@for (imie of imiona; track $index){
    @if(imie == "Adam"){
        <p>JEST TAM ADAM</p>
    }
    <p>{{imie}}</p>
}
