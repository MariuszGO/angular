<H1>System rezerwacji stanowisk komputerowych</H1>

<form (ngSubmit)="dodaj()">
<label for="im">Imię i nazwisko ucznia: </label>
<input type="text" id="im" name="im" [(ngModel)]="imie"><br>
<label for="dz">Dzień tygodnia: </label>
<select id="dz" name="dz" [(ngModel)]="dzien">
    <option>Poniedziałek</option>
    <option>Wtorek</option>
    <option>Środa</option>
    <option>Czwartek</option>
    <option>Piątek</option>
</select><br>
<label for="godzina">Godzina: </label>
<select id="godzina" name="go" [(ngModel)]="godzina">
    <option>8:00</option>
    <option>9:00</option>
    <option>10:00</option>
    <option>11:00</option>
    <option>12:00</option>
</select><br>
<label for="stanowisko">Stanowisko: </label>
<select id="stanowisko" name="stanowisko" [(ngModel)]="stanowisko">
    <option>PC-1</option>
    <option>PC-2</option>
    <option>PC-3</option>
    <option>PC-4</option>
</select><br>
<button>zarezerwuj</button>
</form>
<p>{{komunikat}}</p>






<label>Podaj dzień: 
<select id="dz1" name="dz2s" [(ngModel)]="dany_d">
    <option>Poniedziałek</option>
    <option>Wtorek</option>
    <option>Środa</option>
    <option>Czwartek</option>
    <option>Piątek</option>
    <option>Wszystkie dni</option>
</select><br>
</label>

<button (click)="dany_dzien(dany_d)">Pokaż</button>
<button (click)="sortowanie_godzina()">Sortuj</button>
<table>
    <tr><th>id</th><th>uczeń</th><th>dzień</th><th>godzina</th><th>stanowisko</th><th>anuluj</th></tr>
    @for(r of wynik; track r.id){
        <tr><td>{{r.id}}</td><td>{{r.uczen}}</td><td>{{r.dzien}}</td><td>{{r.godzina}}</td><td>{{r.stanowisko}}</td><td><button type="button" (click)="anuluj(r.id)">anuluj</button></td></tr>
    }
</table>
