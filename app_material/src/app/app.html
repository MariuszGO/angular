<mat-card class="kontener">

  <mat-card-header>
    <mat-card-title>Moja lista zadań</mat-card-title>
    <mat-card-subtitle>
      Aplikacja Angular Material
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>

    <div class="formularz">

      <mat-form-field appearance="outline">
        <mat-label>Nowe zadanie</mat-label>

        <input
          matInput
          [(ngModel)]="nowaNazwa"
          placeholder="Wpisz nazwę zadania">
      </mat-form-field>

      <button mat-flat-button (click)="dodaj()">
        Dodaj
      </button>

    </div>

    @for (zadanie of zadania; track zadanie.id) {

      <div class="zadanie">

        <mat-checkbox
          [(ngModel)]="zadanie.wykonane">

          <span [class.gotowe]="zadanie.wykonane">
            {{ zadanie.nazwa }}
          </span>

        </mat-checkbox>

        <button mat-button (click)="usun(zadanie.id)">
          Usuń
        </button>

      </div>

    } @empty {
      <p>Brak zadań na liście.</p>
    }

    <p>
      Wykonane: {{ wykonane }} z {{ zadania.length }}
    </p>

  </mat-card-content>

</mat-card>
